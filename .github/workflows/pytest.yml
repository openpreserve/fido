name: Pytest

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov coverage-badge
          pip install -e .
      - name: Lint with flake8
        run: flake8 fido tests --count --show-source --statistics
      - name: Test with pytest
        if: ${{ !cancelled() }}
        run: pytest --cov=fido --cov-report=xml
      - name: Generate coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        run: coverage-badge -f -o coverage.svg
      - name: Commit coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push
