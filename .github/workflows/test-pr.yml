name: PR QA

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Checkout and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 3.6 and 3.7 are end of life and setup-python ships no build of either for
        # current runner images. 3.9 is the oldest it still provides there.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U flake8 pytest-cov
          pip install -e .
      - name: Lint code with flake8
        run: flake8 . --count --show-source --max-line-length=127 --statistics
      - name: Test using pytest
        run: pytest --cov=fido
      - name: Generate LCOV coverage report
        if: matrix.python-version == '3.13'
        run: coverage xml -o cobertura.xml
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: cobertura.xml
  coverage:
    name: Quality Assurance
    runs-on: ubuntu-latest
    needs: [ build ]

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage
      - name: Codecov coverage reporting
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false # optional (default = false)
          verbose: true # optional (default = false)
      - name: Codacy analysis reporting
        uses: codacy/codacy-analysis-cli-action@v4.4.7
